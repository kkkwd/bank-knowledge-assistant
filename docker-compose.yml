services:
  backend:
    build:
      context: ./backend
    working_dir: /app
    environment:
      - BACKEND_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - BACKEND_ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
